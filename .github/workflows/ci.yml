name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Estilo
        run: ruff check .

      - name: Tipos
        run: mypy app

      - name: Pruebas
        run: pytest -q

      - name: El contrato y el código coinciden
        run: pytest -q tests/test_contrato.py
